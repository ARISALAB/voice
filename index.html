<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Voice Translator - Subtitle Cinema Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .pulse-red { animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- Header -->
    <header class="max-w-5xl mx-auto w-full flex justify-between items-center mb-6">
        <div class="flex items-center space-x-3">
            <div class="p-2.5 bg-blue-600 rounded-xl shadow-lg shadow-blue-600/30">
                <i class="fa-solid font-bold text-xl text-white fa-language"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white tracking-wide">Cinema Voice Translator</h1>
                <p class="text-xs text-slate-400">Live Υπότιτλοι & Απεριόριστο Ιστορικό</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <select id="sourceLang" class="bg-slate-900 text-slate-200 border border-slate-700 text-sm rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="el-GR" selected>Ελληνικά (el)</option>
                <option value="en-US">English (en)</option>
                <option value="de-DE">Deutsch (de)</option>
                <option value="fr-FR">Français (fr)</option>
                <option value="es-ES">Español (es)</option>
                <option value="it-IT">Italiano (it)</option>
            </select>

            <button id="swapLangBtn" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition">
                <i class="fa-solid fa-arrows-rotate"></i>
            </button>

            <select id="targetLang" class="bg-slate-900 text-slate-200 border border-slate-700 text-sm rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="en">English (en)</option>
                <option value="el">Ελληνικά (el)</option>
                <option value="de">Deutsch (de)</option>
                <option value="fr">Français (fr)</option>
                <option value="es">Español (es)</option>
                <option value="it">Italiano (it)</option>
            </select>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto w-full flex-grow flex flex-col gap-6">

        <!-- Active Subtitle Screen (Cinema View) -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-2xl relative overflow-hidden backdrop-blur-md min-h-[220px] flex flex-col justify-center items-center text-center">
            
            <div id="statusBadge" class="absolute top-4 left-4 flex items-center space-x-2 bg-slate-800/80 px-3 py-1 rounded-full border border-slate-700 text-xs font-semibold text-slate-400">
                <span id="statusDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
                <span id="statusText">Αναμονή...</span>
            </div>

            <!-- Subtitle Output Container -->
            <div class="w-full space-y-4 my-2">
                <!-- Live Source Sentence -->
                <p id="activeSource" class="text-2xl md:text-3xl font-semibold text-slate-100 tracking-wide transition-all duration-150">
                    <span class="text-slate-500 italic text-xl">Πατήστε το κουμπί εγγραφής και αρχίστε να μιλάτε...</span>
                </p>
                <!-- Live Translated Subtitle -->
                <p id="activeTarget" class="text-xl md:text-2xl font-bold text-amber-400 tracking-wide transition-all duration-150 min-h-[32px]">
                    ...
                </p>
            </div>
        </div>

        <!-- Controls Bar -->
        <div class="flex justify-center items-center">
            <button id="toggleMicBtn" class="flex items-center space-x-3 px-8 py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold text-lg rounded-full shadow-lg shadow-blue-600/30 transition-all transform active:scale-95">
                <i class="fa-solid fa-microphone text-xl" id="micIcon"></i>
                <span id="micText">Έναρξη Live Εγγραφής</span>
            </button>
        </div>

        <!-- Full History Log -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-grow">
            <!-- Source History -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col h-[280px]">
                <div class="flex justify-between items-center pb-2 border-b border-slate-800 mb-3">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider"><i class="fa-solid fa-align-left mr-1.5"></i>Ιστορικό Αρχικού Κειμένου</span>
                    <button id="copySourceBtn" title="Αντιγραφή" class="text-slate-400 hover:text-white text-xs p-1">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
                <div id="sourceLog" class="flex-grow overflow-y-auto custom-scrollbar space-y-2 text-sm text-slate-300 pr-2">
                    <p class="text-slate-600 italic">Το ιστορικό ομιλίας θα εμφανίζεται εδώ...</p>
                </div>
            </div>

            <!-- Target History -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col h-[280px]">
                <div class="flex justify-between items-center pb-2 border-b border-slate-800 mb-3">
                    <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider"><i class="fa-solid fa-language mr-1.5"></i>Ιστορικό Μετάφρασης</span>
                    <div class="flex space-x-2">
                        <button id="speakLogBtn" title="Εκφώνηση" class="text-slate-400 hover:text-white text-xs p-1">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                        <button id="copyTargetBtn" title="Αντιγραφή" class="text-slate-400 hover:text-white text-xs p-1">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                </div>
                <div id="targetLog" class="flex-grow overflow-y-auto custom-scrollbar space-y-2 text-sm text-emerald-300/90 pr-2">
                    <p class="text-slate-600 italic">Το ιστορικό μετάφρασης θα εμφανίζεται εδώ...</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer Tools -->
    <footer class="max-w-5xl mx-auto w-full mt-6 flex justify-between items-center text-xs text-slate-500 pt-4 border-t border-slate-800/60">
        <div>
            <span>Status: </span><span id="apiStatus" class="text-emerald-400 font-semibold">Ready</span>
        </div>
        <div class="flex space-x-4">
            <button id="clearBtn" class="hover:text-rose-400 transition"><i class="fa-solid fa-trash-can mr-1"></i>Καθαρισμός</button>
            <button id="downloadBtn" class="hover:text-blue-400 transition"><i class="fa-solid fa-download mr-1"></i>Λήψη Script (.txt)</button>
        </div>
    </footer>

    <script>
        // State variables
        let isRecording = false;
        let recognition = null;
        let translateTimeout = null;
        let lastFinalText = '';
        let fullSourceLog = [];
        let fullTargetLog = [];
        let currentTargetLanguage = 'en';

        // Elements
        const toggleMicBtn = document.getElementById('toggleMicBtn');
        const micIcon = document.getElementById('micIcon');
        const micText = document.getElementById('micText');
        const statusBadge = document.getElementById('statusBadge');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const activeSource = document.getElementById('activeSource');
        const activeTarget = document.getElementById('activeTarget');
        const sourceLog = document.getElementById('sourceLog');
        const targetLog = document.getElementById('targetLog');
        const sourceLangSelect = document.getElementById('sourceLang');
        const targetLangSelect = document.getElementById('targetLang');
        const swapLangBtn = document.getElementById('swapLangBtn');
        const clearBtn = document.getElementById('clearBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const copySourceBtn = document.getElementById('copySourceBtn');
        const copyTargetBtn = document.getElementById('copyTargetBtn');
        const speakLogBtn = document.getElementById('speakLogBtn');

        // Check Web Speech API support
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert('Ο περιηγητής σας δεν υποστηρίζει Web Speech API. Παρακαλούμε χρησιμοποιήστε Google Chrome ή Microsoft Edge.');
        } else {
            initSpeechRecognition();
        }

        function initSpeechRecognition() {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = sourceLangSelect.value;

            recognition.onstart = () => {
                isRecording = true;
                updateMicUI(true);
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                let currentText = finalTranscript || interimTranscript;

                if (currentText.trim() !== '') {
                    activeSource.textContent = currentText;
                    
                    // Throttle live translation
                    clearTimeout(translateTimeout);
                    translateTimeout = setTimeout(() => {
                        fetchTranslation(currentText, false);
                    }, 300);
                }

                // If sentence is finalized by speech engine
                if (finalTranscript.trim() !== '' && finalTranscript !== lastFinalText) {
                    lastFinalText = finalTranscript;
                    commitSentenceToHistory(finalTranscript);
                }
            };

            recognition.onerror = (event) => {
                console.warn('Speech recognition error:', event.error);
                if (event.error === 'no-speech') return;
            };

            recognition.onend = () => {
                // Auto restart if user didn't explicitly click stop
                if (isRecording) {
                    try { recognition.start(); } catch(e) {}
                } else {
                    updateMicUI(false);
                }
            };
        }

        // Translation Function with Multi-API Fallback & Greek-Text Filters
        async function fetchTranslation(text, isFinalCommit = false) {
            if (!text || !text.trim()) return;

            const targetLang = targetLangSelect.value;
            const sourceLang = sourceLangSelect.value.split('-')[0];

            // Free translation API endpoints (Lingva + Free Google Proxies)
            const endpoints = [
                `https://lingva.ml/api/v1/${sourceLang}/${targetLang}/${encodeURIComponent(text)}`,
                `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`
            ];

            let translatedText = '';

            for (let url of endpoints) {
                try {
                    const res = await fetch(url);
                    if (!res.ok) continue;
                    const data = await res.json();

                    if (data.translation) {
                        translatedText = data.translation;
                        break;
                    } else if (Array.isArray(data) && data[0] && data[0][0]) {
                        translatedText = data[0].map(item => item[0]).join('');
                        break;
                    }
                } catch (e) {
                    console.warn('Translation endpoint failed, trying fallback...', e);
                }
            }

            if (!translatedText) return;

            // FILTER: If target language is NOT Greek/Greek-like, but result contains Greek script, filter it out!
            if (targetLang !== 'el' && /[\u0370-\u03FF]/.test(translatedText)) {
                // API returned untranslated source text (e.g., partial words)
                if (!isFinalCommit) {
                    return; // Don't show raw Greek in translation area during live stream
                }
            }

            activeTarget.textContent = translatedText;

            if (isFinalCommit) {
                appendTargetLog(translatedText);
            }
        }

        function commitSentenceToHistory(sourceText) {
            appendSourceLog(sourceText);
            fetchTranslation(sourceText, true);
        }

        function appendSourceLog(text) {
            if (fullSourceLog.length === 0) sourceLog.innerHTML = '';
            
            fullSourceLog.push(text);
            const p = document.createElement('p');
            p.className = 'bg-slate-800/60 p-2.5 rounded-lg border border-slate-700/50 leading-relaxed';
            p.textContent = text;
            sourceLog.appendChild(p);
            sourceLog.scrollTop = sourceLog.scrollHeight;
        }

        function appendTargetLog(text) {
            if (fullTargetLog.length === 0) targetLog.innerHTML = '';

            fullTargetLog.push(text);
            const p = document.createElement('p');
            p.className = 'bg-slate-800/60 p-2.5 rounded-lg border border-slate-700/50 leading-relaxed';
            p.textContent = text;
            targetLog.appendChild(p);
            targetLog.scrollTop = targetLog.scrollHeight;
        }

        function updateMicUI(recording) {
            if (recording) {
                toggleMicBtn.className = "flex items-center space-x-3 px-8 py-4 bg-rose-600 hover:bg-rose-500 text-white font-bold text-lg rounded-full shadow-lg pulse-red transition-all transform active:scale-95";
                micIcon.className = "fa-solid fa-stop text-xl";
                micText.textContent = "Διακοπή Εγγραφής";
                statusDot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-ping";
                statusText.textContent = "Ενεργή Ακρόαση...";
                statusText.className = "text-emerald-400 font-medium";
            } else {
                toggleMicBtn.className = "flex items-center space-x-3 px-8 py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold text-lg rounded-full shadow-lg shadow-blue-600/30 transition-all transform active:scale-95";
                micIcon.className = "fa-solid fa-microphone text-xl";
                micText.textContent = "Έναρξη Live Εγγραφής";
                statusDot.className = "w-2 h-2 rounded-full bg-slate-500";
                statusText.textContent = "Αναμονή...";
                statusText.className = "text-slate-400";
            }
        }

        // Button Event Listeners
        toggleMicBtn.addEventListener('click', () => {
            if (isRecording) {
                isRecording = false;
                recognition.stop();
            } else {
                recognition.lang = sourceLangSelect.value;
                recognition.start();
            }
        });

        sourceLangSelect.addEventListener('change', () => {
            if (isRecording) {
                recognition.stop();
                setTimeout(() => {
                    recognition.lang = sourceLangSelect.value;
                    recognition.start();
                }, 200);
            }
        });

        swapLangBtn.addEventListener('click', () => {
            const temp = sourceLangSelect.value.split('-')[0];
            sourceLangSelect.value = targetLangSelect.value === 'el' ? 'el-GR' : 'en-US';
            targetLangSelect.value = temp === 'el' ? 'en' : 'el';
            if (isRecording) {
                recognition.stop();
                setTimeout(() => {
                    recognition.lang = sourceLangSelect.value;
                    recognition.start();
                }, 200);
            }
        });

        clearBtn.addEventListener('click', () => {
            fullSourceLog = [];
            fullTargetLog = [];
            sourceLog.innerHTML = '<p class="text-slate-600 italic">Το ιστορικό ομιλίας θα εμφανίζεται εδώ...</p>';
            targetLog.innerHTML = '<p class="text-slate-600 italic">Το ιστορικό μετάφρασης θα εμφανίζεται εδώ...</p>';
            activeSource.innerHTML = '<span class="text-slate-500 italic text-xl">Πατήστε το κουμπί εγγραφής και αρχίστε να μιλάτε...</span>';
            activeTarget.textContent = '...';
        });

        downloadBtn.addEventListener('click', () => {
            if (fullSourceLog.length === 0) return alert('Δεν υπάρχει διαθέσιμο ιστορικό.');
            
            let content = "=== ΙΣΤΟΡΙΚΟ ΦΩΝΗΤΙΚΗΣ ΜΕΤΑΦΡΑΣΗΣ ===\n\n";
            for (let i = 0; i < fullSourceLog.length; i++) {
                content += `[Αρχικό]: ${fullSourceLog[i]}\n`;
                content += `[Μετάφραση]: ${fullTargetLog[i] || ''}\n\n`;
            }

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `translation_script_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
        });

        copySourceBtn.addEventListener('click', () => {
            if (fullSourceLog.length > 0) navigator.clipboard.writeText(fullSourceLog.join('\n'));
        });

        copyTargetBtn.addEventListener('click', () => {
            if (fullTargetLog.length > 0) navigator.clipboard.writeText(fullTargetLog.join('\n'));
        });

        speakLogBtn.addEventListener('click', () => {
            if (fullTargetLog.length === 0) return;
            const textToSpeak = fullTargetLog.join('. ');
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = targetLangSelect.value;
            window.speechSynthesis.speak(utterance);
        });
    </script>
</body>
</html>
